apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1
spec:
  ingressClassName: nginx
  rules:
  - host: mydomain.com
    http:
      paths:
      - pathType: ImplementationSpecific # mydomain.com/v2/load-test  -> mydomain.com/load-test
        path: "/v2(.*)"
        backend:
          service:
            name: hello-service
            port:
              number: 80
